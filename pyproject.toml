[project]
name = "tesbota"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk",
    "pyyaml",
]

[project.scripts]
tesbota = "tesbota.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tesbota"]
